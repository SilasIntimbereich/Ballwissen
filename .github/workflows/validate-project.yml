name: Validate FOOTBALL ARCADE
on:
  push:
    branches: [main, v4-arcade-menu-pass]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Run syntax, data and player-matching tests
        run: npm test
      - name: Install Chromium for real browser tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Test mobile gameplay and offline reload
        run: npm run test:browser
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          for file in supabase/functions/*/index.ts; do
            echo "Checking $file"
            deno check "$file"
          done
