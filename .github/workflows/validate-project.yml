name: Validate FOOTBALL ARCADE
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax, data and player-matching tests
        run: npm test
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          for file in supabase/functions/*/index.ts; do
            echo "Checking $file"
            deno check "$file"
          done

  fifa-roster-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install audit dependencies
        run: npm ci
      - name: Compare all 48 squads with FIFA's final PDF
        run: npm run audit:2026
      - name: Upload full player-by-player audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fifa-2026-roster-audit
          path: artifacts/fifa-2026-audit.json
          if-no-files-found: warn
