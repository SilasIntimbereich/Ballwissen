name: Import verified historical World Cup squads
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and validate historical squad data
        run: node scripts/import-historical-squads.mjs
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical-squads.json
          git diff --cached --quiet || git commit -m "Import verified historical World Cup squads"
          git push
