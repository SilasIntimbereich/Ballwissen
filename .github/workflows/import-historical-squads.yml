name: Import historical World Cup squads (structural checks)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/import-historical-squads.mjs'
      - '.github/workflows/import-historical-squads.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and validate historical squad data
        run: node scripts/import-historical-squads.mjs
      - name: Validate all seven tournament datasets
        run: node scripts/validate-data.mjs
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical-squads.json
          git diff --cached --quiet || git commit -m "Import historical World Cup squads (structural checks)"
          git push
