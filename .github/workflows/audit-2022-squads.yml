name: Audit 2022 World Cup squads and clubs
on:
  push:
    branches: [main]
    paths:
      - "data/historical-squads.json"
      - "scripts/audit-2022-squads.mjs"
      - ".github/workflows/audit-2022-squads.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "57 6 * * 3"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF parser
        run: npm install --no-save pdfjs-dist@^5.4.394
      - name: Compare 2022 squads against FIFA PDF and Goal
        run: node scripts/audit-2022-squads.mjs
      - name: Commit only fully cross-verified 2022 teams
        if: success() && github.event_name != 'pull_request'
        run: |
          cp artifacts/historical-squads-updated.json data/historical-squads.json
          cp artifacts/roster-audit-updated.json data/roster-audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          git add data/historical-squads.json data/roster-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify 2022 teams with FIFA and independent squad sources"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload complete comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2022-world-cup-roster-audit
          path: |
            artifacts/2022-roster-club-audit.json
            artifacts/historical-squads-updated.json
            artifacts/roster-audit-updated.json
          if-no-files-found: warn
          retention-days: 30
